<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invitación</title>
  <style>
    :root {
      --ink: #30242c;
      --muted: #67555e;
      --accent: #63374e;
      --paper: #fffefa;
      --line: #e3d6d4;
      --error-color: #c41230;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse 44rem 25rem at 50% 0, #f7e8e3, transparent), #faf6f0; color: var(--ink); font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 56rem; margin: auto; padding: clamp(1rem, 5vw, 3rem); }
    section { padding: clamp(1rem, 3vw, 1.5rem); background: var(--paper); box-shadow: 0 8px 24px #5832420a; }
    legend { font-weight: 700; font-size: 1rem; }
    button { min-height: 3rem; margin-top: .75rem; padding: .65rem 1.15rem; border: 0; border-radius: .65rem; background: var(--accent); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .response-error { margin: .5rem 0 0; color: var(--error-color); font-size: .875rem; font-weight: 600; }
    .access-card h1 { margin: 0; font-family: Georgia, serif; font-weight: 500; line-height: 1.06; letter-spacing: -.045em; }
    .access-page { display: grid; min-height: 100svh; place-items: center; }
    .access-page[hidden] { display: none; }
    .access-card { width: min(100%, 26rem); margin: 0; padding: clamp(1.25rem, 5vw, 2rem); }
    .access-card h1 { max-width: none; font-size: clamp(1.05rem, 5.5vw, 2rem); text-align: center; white-space: nowrap; }
    .access-form { display: grid; gap: .5rem; margin-top: 1.4rem; }
    .access-form label { font-weight: 600; }
    .access-form :is(input, select) { min-width: 0; width: 100%; min-height: 3rem; margin-bottom: .45rem; padding: .55rem .7rem; border: 1px solid #b8a1aa; border-radius: .65rem; color: var(--ink); background: var(--paper); font: inherit; }
    .access-birthday { margin: 0; padding: 0; border: 0; background: transparent; }
    .access-birthday legend { margin-bottom: .5rem; padding: 0; font-weight: 600; }
    .birthday-inputs { display: grid; grid-template-columns: minmax(3.25rem, .85fr) minmax(0, 1.5fr) minmax(4.25rem, .9fr); gap: .4rem; }
    .birthday-inputs :is(input, select) { padding-inline: .45rem; }
    .access-form button { margin-top: .25rem; }
    #access-error:empty { display: none; }
    :focus-visible { outline: 3px solid #855374; outline-offset: 3px; }
    #access-submit:disabled { opacity: .65; cursor: wait; }
    @media (max-width: 36rem) { main { padding: 1.25rem 1rem max(1.5rem, env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>
  <main id="access-page" class="access-page">
    <section class="access-card" aria-labelledby="access-title">
      <h1 id="access-title">Ingresa tus datos, Pam</h1>
      <form id="access-form" class="access-form">
        <fieldset class="access-birthday">
          <legend>Tu fecha de nacimiento</legend>
          <div class="birthday-inputs">
            <select id="access-day" aria-label="Día" required>
              <option value="" selected disabled>Día</option>
            </select>
            <select id="access-month" aria-label="Mes" required>
              <option value="" selected disabled>Mes</option>
              <option value="01">Enero</option>
              <option value="02">Febrero</option>
              <option value="03">Marzo</option>
              <option value="04">Abril</option>
              <option value="05">Mayo</option>
              <option value="06">Junio</option>
              <option value="07">Julio</option>
              <option value="08">Agosto</option>
              <option value="09">Septiembre</option>
              <option value="10">Octubre</option>
              <option value="11">Noviembre</option>
              <option value="12">Diciembre</option>
            </select>
            <select id="access-year" aria-label="Año" required>
              <option value="" selected disabled>Año</option>
            </select>
          </div>
        </fieldset>
        <label for="access-food">Una de tus comidas favoritas</label>
        <input id="access-food" type="text" autocomplete="off" spellcheck="false" required>
        <button id="access-submit" type="submit">Entrar</button>
        <p id="access-error" class="response-error" role="alert"></p>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const accessPage = document.getElementById('access-page');
      const form = document.getElementById('access-form');
      const dayInput = document.getElementById('access-day');
      const monthInput = document.getElementById('access-month');
      const yearInput = document.getElementById('access-year');
      const foodInput = document.getElementById('access-food');
      const submitButton = document.getElementById('access-submit');
      const error = document.getElementById('access-error');
      const encryptedInvitation = document.getElementById('encrypted-invitation');
      const encoder = new TextEncoder();
      const decodeBase64 = text => Uint8Array.from(atob(text), character => character.charCodeAt(0));

      for (let day = 1; day <= 31; day++) {
        const option = document.createElement('option');
        option.value = String(day).padStart(2, '0');
        option.textContent = String(day);
        dayInput.append(option);
      }
      for (let year = new Date().getFullYear(); year >= 1900; year--) {
        const option = document.createElement('option');
        option.value = String(year);
        option.textContent = option.value;
        yearInput.append(option);
      }

      async function decryptInvitation(subtle) {
        const birthday = [yearInput.value, monthInput.value, dayInput.value].join('-');
        const food = foodInput.value.trim().toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
        const credentials = encoder.encode('proyecto-pam/v1|' + birthday + '|' + food);
        const material = await subtle.importKey('raw', credentials, 'PBKDF2', false, ['deriveKey']);
        const key = await subtle.deriveKey({
          name: 'PBKDF2',
          hash: 'SHA-256',
          iterations: Number(encryptedInvitation.dataset.iterations),
          salt: decodeBase64(encryptedInvitation.dataset.salt)
        }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        const decrypted = await subtle.decrypt({
          name: 'AES-GCM',
          iv: decodeBase64(encryptedInvitation.dataset.iv)
        }, key, decodeBase64(encryptedInvitation.textContent));
        return JSON.parse(new TextDecoder().decode(decrypted));
      }

      function openInvitation(page) {
        const styles = document.createElement('style');
        styles.textContent = page.styles;
        document.head.append(styles);

        const template = document.createElement('template');
        template.innerHTML = page.markup;
        document.body.append(template.content);

        const script = document.createElement('script');
        script.textContent = page.script;
        document.body.append(script);

        form.reset();
        accessPage.hidden = true;
        document.querySelector('#planner h1').focus();
      }

      form.addEventListener('input', () => { error.textContent = ''; });
      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (submitButton.disabled) return;

        const subtle = globalThis.crypto?.subtle;
        if (!subtle) {
          error.textContent = 'El acceso requiere un contexto seguro. Abre la página por HTTPS.';
          return;
        }

        submitButton.disabled = true;
        error.textContent = '';
        let page;
        try {
          page = await decryptInvitation(subtle);
        } catch {
          error.textContent = 'Información incorrecta. Inténtalo de nuevo.';
          return;
        } finally {
          submitButton.disabled = false;
        }
        openInvitation(page);
      });
    })();
  </script>
